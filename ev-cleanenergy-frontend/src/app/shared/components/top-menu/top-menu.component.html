<header class="top-menu">
  <div class="container top-menu-container">
    <div class="brand">
      <span class="brand-icon">🚗</span>
      <span class="brand-name">EV Clean Energy</span>
    </div>
    
    <span class="spacer"></span>
    
    <nav class="nav-links" [class.nav-open]="isMenuOpen">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active-link">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a class="nav-link" routerLink="/summary" routerLinkActive="active-link">
        <span class="nav-icon">📈</span>
        <span>Summary</span>
      </a>
      <a class="nav-link" routerLink="/reports" routerLinkActive="active-link">
        <span class="nav-icon">📋</span>
        <span>Reports</span>
      </a>
      <button class="nav-link logout-button" (click)="logout()">
        <span class="nav-icon">🚪</span>
        <span>Logout</span>
      </button>
    </nav>
    
    <button class="menu-toggle" (click)="toggleMenu()">
      <span class="toggle-icon">{{ isMenuOpen ? '✕' : '☰' }}</span>
    </button>
  </div>
</header>
